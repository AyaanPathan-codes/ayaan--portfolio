<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#00F5FF"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#00F5FF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Gradient border -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- AP Text -->
  <text
    x="50"
    y="67"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="44"
    font-weight="800"
    text-anchor="middle"
    fill="url(#textGrad)"
    letter-spacing="-2"
  >AP</text>
</svg>
